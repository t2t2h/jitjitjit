name: Build HuskJITKick

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install make ldid

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build dylib
        run: |
          gmake clean || true
          gmake FINALPACKAGE=1

      - name: Collect dylib
        run: |
          mkdir -p out
          find .theos -name "HuskJITKick.dylib" -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuskJITKick-dylib
          path: out/HuskJITKick.dylib
